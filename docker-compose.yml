services:
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Takes LLM_PROVIDER from .env. Subscription mode can't work in a container.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic-api}
    volumes:
      - outbox:/app/.local
    # Local Supabase runs on the host during development.
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  outbox:
